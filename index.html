<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f4f9f8;color:#173b47}
header{text-align:center;background:linear-gradient(115deg,#d5f2e7,#e8f3ff,#fff0d5);padding:28px 16px 24px}
h1{font-size:clamp(1.65rem,4vw,2.5rem);margin:0}header p{font-size:1.03rem;margin:9px auto 0;max-width:700px}
main{max-width:1200px;margin:auto;padding:22px 14px 40px}
.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.control{border:0;border-radius:28px;background:#087585;color:#fff;padding:13px 18px;font:600 1rem system-ui;cursor:pointer}
.control:focus-visible,.photo:focus-visible{outline:3px solid #ef9a34;outline-offset:3px}
.volume{display:flex;align-items:center;gap:7px;font-size:.92rem}
.volume input{width:100px;accent-color:#087585}
.hint{text-align:center;color:#536c73;font-size:.93rem;margin:0 0 18px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.photo{border:0;background:#fff;padding:0;overflow:hidden;border-radius:15px;box-shadow:0 5px 19px #173b4722;cursor:zoom-in}
.photo img{width:100%;height:315px;display:block;object-fit:cover}
.photo:last-child{grid-column:1/-1}.photo:last-child img{height:430px;object-position:center 40%}
.modal{display:none;position:fixed;inset:0;background:#06171bf2;z-index:30;padding:56px 12px 16px;align-items:center;justify-content:center}
.modal.open{display:flex}.modal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.close{position:absolute;right:16px;top:12px;border:0;background:white;color:#123;padding:9px 16px;border-radius:24px;font:600 1rem system-ui;cursor:pointer}
footer{text-align:center;color:#58757b;padding:0 0 26px}
@media(max-width:650px){.gallery{grid-template-columns:1fr;gap:13px}.photo:last-child{grid-column:auto}.photo img,.photo:last-child img{height:auto;aspect-ratio:4/3}}
</style>

<script>
"use strict";
const photoButtons=[...document.querySelectorAll(".photo")];
const modal=document.querySelector("#modal"),big=document.querySelector("#big"),music=document.querySelector("#music"),vol=document.querySelector("#volume");
let current=0,playing=false,audio=null,master=null,interval=null,beat=0;
const melodies=[
  [392,440,523,587,523,440,392,330], // aire andino, instrumental original
  [330,392,440,392,523,440,392,330], // percusión afroamericana
  [262,330,392,440,392,330,294,262], // aire de danza colonial
  [349,440,523,440,392,349,294,349], // cocina y encuentro
  [294,392,440,392,330,294,262,294], // aire folklórico rural
  [330,440,494,523,494,440,392,330], // movimiento y viaje
  [392,523,587,523,440,392,349,392]  // pulso ceremonial
];
const beats=[
 [1,0,0.5,0,1,0,0.5,0],
 [1,.55,.75,.55,1,.55,.8,.55],
 [1,0,.55,0,1,0,.55,0],
 [1,.3,.5,.3,1,.3,.5,.3],
 [1,0,.65,.3,1,0,.65,.3],
 [1,.25,.5,.25,1,.25,.5,.25],
 [1,0,.5,0,1,0,.75,0]
];
const tempos=[195,165,190,185,175,170,190];
function tone(freq,dur=0.23,type="triangle",level=.25){
 if(!audio||!master)return;
 const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,level),t+.018);
 g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.025);
}
function drum(strength){
 if(!audio||!master)return;
 const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type="sine";o.frequency.setValueAtTime(135,t);o.frequency.exponentialRampToValueAtTime(52,t+.14);
 g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.36*strength,t+.008);
 g.gain.exponentialRampToValueAtTime(.001,t+.18);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+.19);
}
function percussion(accent=false){
 if(!audio||!master)return;
 const duration=.085,t=audio.currentTime;
 const buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*duration),audio.sampleRate);
 const samples=buffer.getChannelData(0);
 for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*(1-i/samples.length);
 const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();
 src.buffer=buffer;filter.type="highpass";filter.frequency.value=accent?1150:4700;
 gain.gain.value=accent?.18:.10;
 src.connect(filter);filter.connect(gain);gain.connect(master);src.start(t);
}
function tick(){
 const pos=beat%8,mel=melodies[current],r=beats[current][pos];
 // Ritmo de fiesta: bombo, palmas y percusión rápida.
 if(pos===0||pos===4)drum(1.2);
 else if(pos===2||pos===6){drum(.65);percussion(true)}
 else drum(.33);
 percussion(false);
 if(r&&pos%2===0)percussion(true);
 tone(mel[pos],.16,current===1?"sawtooth":"triangle",current===1?.14:.22);
 if(pos===0||pos===4)tone(mel[pos]/2,.24,"sawtooth",.10);
 beat++;
}
function reschedule(){if(interval)clearInterval(interval);interval=null;if(playing){beat=0;tick();interval=setInterval(tick,tempos[current])}}
async function toggle(){
 if(playing){playing=false;clearInterval(interval);interval=null;music.textContent="▶ Escuchar música festiva";if(audio){await audio.suspend()}return}
 try{
  if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.connect(audio.destination)}
  master.gain.value=(Number(vol.value)/100)*.85;
  await audio.resume();playing=true;music.textContent="⏸ Detener música";reschedule()
 }catch(e){music.textContent="Música no disponible en este navegador"}
}
music.addEventListener("click",toggle);
vol.addEventListener("input",()=>{if(master)master.gain.value=(Number(vol.value)/100)*.85});
photoButtons.forEach((button,index)=>button.addEventListener("click",()=>{
 current=index;big.src=button.querySelector("img").src;big.alt=button.querySelector("img").alt;
 modal.classList.add("open");document.querySelector("#close").focus();
 if(playing)reschedule();
}));
function closeModal(){modal.classList.remove("open");big.removeAttribute("src");photoButtons[current].focus()}
document.querySelector("#close").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeModal()});
</script></body></html>
